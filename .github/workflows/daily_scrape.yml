name: Daily Kicker Scraper

on:
  schedule:
    # Ежедневный запуск в 08:00 UTC (12:00 по Еревану)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          pip install -r requirements.txt

      - name: Запуск скрапера и отправка в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kicker_scraper.py
